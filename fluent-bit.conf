[SERVICE]
    Flush        5
    Log_Level    info
    Parsers_File parsers.conf

[INPUT]
    Name              tail
    Path              /var/lib/docker/containers/*/*.log
    Parser            docker
    Tag               docker.*

[FILTER]
    Name    grep
    Match   docker.*
    Regex   log login_attempt

[FILTER]
    Name    parser
    Match   docker.*
    Key_Name log
    Parser   json_inner
    Reserve_Data On

[OUTPUT]
    Name         opensearch
    Match        *
    Host         opensearch
    Port         9200
    Index        login-events
    Suppress_Type_Name On